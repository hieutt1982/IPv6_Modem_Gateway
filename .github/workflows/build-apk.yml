name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài đặt Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Cài đặt Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Cài đặt Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 5. Cài đặt Android Platform
      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 6. Build APK
      - name: Build debug APK
        run: |
          gradle -p IPv6_Modem_Gateway --no-daemon assembleDebug

      # 7. Kiểm tra APK đã được tạo
      - name: Verify APK
        run: |
          echo "Checking APK output..."
          ls -lah IPv6_Modem_Gateway/app/build/outputs/apk/debug/
          test -f IPv6_Modem_Gateway/app/build/outputs/apk/debug/app-debug.apk

      # 8. Upload APK lên GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPv6-Modem-Gateway-APK
          path: IPv6_Modem_Gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
